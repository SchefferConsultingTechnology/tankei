# Blueprint do Render (https://render.com/docs/blueprint-spec): API do Tankei
# para testes (ADR 0016). Deploy automático a cada push na development.
#
# Plano gratuito: o serviço dorme após 15 minutos sem uso (a primeira
# requisição depois disso leva cerca de 1 minuto) e as rotinas agendadas não
# rodam enquanto ele dorme. Para produção, trocar `plan`.
services:
  - type: web
    name: tankei-api
    runtime: node
    plan: free
    # Mesma região do banco no Supabase (us-west-2, Oregon).
    region: oregon
    branch: development
    rootDir: .
    # Inclui as dependências de desenvolvimento: o build do Nest e as
    # migrations (drizzle-kit) precisam delas. "@tankei/api..." compila
    # também o que a API usa (@tankei/shared), na ordem certa; o Turbo não é
    # usado porque procura o pnpm no PATH.
    buildCommand: >-
      npx --yes pnpm@10.18.3 install --frozen-lockfile --prod=false &&
      npx --yes pnpm@10.18.3 --filter "@tankei/api..." run build
    # Sem etapa de pré-deploy no plano gratuito: as migrations rodam na subida
    # (idempotentes; só aplicam as que faltam).
    startCommand: >-
      cd apps/api && ./node_modules/.bin/drizzle-kit migrate &&
      node dist/main.js
    healthCheckPath: /v1/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: TRUST_PROXY
        value: '1'

      # Segredos: preencher no painel do Render (Environment), nunca aqui.
      # DATABASE_URL: Supabase pelo pooler em modo sessão (IPv4, porta 5432,
      # usuário postgres.<projeto>), com ?sslmode=require&uselibpqcompat=true
      # no fim (ADR 0016). Nem a conexão direta (só IPv6) nem o pooler em modo
      # transação (porta 6543) servem.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # E-mails (ADR 0025): chave do Resend, a mesma dos outros projetos no
      # domínio scheffer.solutions. Sem ela, a API não envia (só registra).
      - key: RESEND_API_KEY
        sync: false
      # Endereço de resposta dos e-mails (opcional). Vazio: sem resposta.
      - key: MAIL_REPLY_TO
        sync: false
      # Imagens (ADR 0026): Supabase Storage pela API S3 (Storage > S3
      # Connection). Endpoint https://<projeto>.supabase.co/storage/v1/s3;
      # URL pública https://<projeto>.supabase.co/storage/v1/object/public/tankei-imagens.
      # Sem elas, o envio de imagens responde 503.
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_ACCESS_KEY_ID
        sync: false
      - key: STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: STORAGE_PUBLIC_URL
        sync: false

      # Não são segredos (ADR 0015).
      - key: GOOGLE_CLIENT_IDS
        value: 881187129858-3elfcgukc2u988u5gc5sqfvjqv0hd334.apps.googleusercontent.com
      - key: STORAGE_REGION
        value: us-west-2
      - key: STORAGE_BUCKET
        value: tankei-imagens
      # Remetente e links dos e-mails (ADR 0025).
      - key: MAIL_FROM
        value: Tankei <nao-responda@scheffer.solutions>
      - key: PORTAL_URL
        value: https://tankei-portal.onrender.com
      - key: ADMIN_URL
        value: https://tankei-admin.onrender.com

  # Portal do posto (ADR 0018) e administração (ADR 0019): sites estáticos.
  # As rotas são do navegador (React Router): tudo volta para o index.html.
  # Os endereços abaixo precisam estar nas "Authorized JavaScript origins" do
  # cliente OAuth Web do Google (ADR 0015).
  - type: web
    name: tankei-portal
    runtime: static
    branch: development
    rootDir: .
    buildCommand: >-
      npx --yes pnpm@10.18.3 install --frozen-lockfile &&
      npx --yes pnpm@10.18.3 --filter "@tankei/portal..." run build
    staticPublishPath: ./apps/portal/dist
    autoDeploy: true
    buildFilter:
      paths:
        - apps/portal/**
        - packages/shared/**
        - pnpm-lock.yaml
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Arquivos com hash no nome: podem ficar guardados no navegador.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: VITE_API_URL
        value: https://tankei-api.onrender.com/v1
      - key: VITE_GOOGLE_CLIENT_ID
        value: 881187129858-3elfcgukc2u988u5gc5sqfvjqv0hd334.apps.googleusercontent.com

  - type: web
    name: tankei-admin
    runtime: static
    branch: development
    rootDir: .
    buildCommand: >-
      npx --yes pnpm@10.18.3 install --frozen-lockfile &&
      npx --yes pnpm@10.18.3 --filter "@tankei/admin..." run build
    staticPublishPath: ./apps/admin/dist
    autoDeploy: true
    buildFilter:
      paths:
        - apps/admin/**
        - packages/shared/**
        - pnpm-lock.yaml
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: VITE_API_URL
        value: https://tankei-api.onrender.com/v1
      - key: VITE_GOOGLE_CLIENT_ID
        value: 881187129858-3elfcgukc2u988u5gc5sqfvjqv0hd334.apps.googleusercontent.com
