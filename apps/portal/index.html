<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Portal do posto Tankei: preços, concorrência e reputação." />
    <meta name="theme-color" content="#012049" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Tankei · Portal do posto</title>
    <!-- Aplica o tema salvo antes da primeira pintura (sem piscar). -->
    <script>
      try {
        var t = localStorage.getItem('tankei:theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
