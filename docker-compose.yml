services:
  db:
    image: postgis/postgis:17-3.5
    container_name: tankei-db
    environment:
      POSTGRES_USER: tankei
      POSTGRES_PASSWORD: tankei
      POSTGRES_DB: tankei
    ports:
      - "5433:5432"
    volumes:
      - tankei-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tankei -d tankei"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tankei-db:
